<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="snake">
    <title>snake</title>
    <style>
        #gameCanvas {
            border: 2px solid #333;
            background-color: #000;
            display: block;
            margin: 20px auto;
        }
        #score {
            font-size: 24px;
            margin: 10px;
            font-family: Arial, sans-serif;
        }
        .controls {
            margin: 20px;
            font-family: Arial, sans-serif;
            color: #333;
        }
    </style>
</head>

<body style="text-align: center; margin: 20px 0;">
    <a href="./index.html">Back to Home</a>
    
    <div>
        <h1>Snake Game</h1>
        <div id="score">Score: 0</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>Use Arrow Keys to move the snake</p>
            <p>Press SPACE to pause/resume</p>
            <p>i used ai for this</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 }
        ];
        let food = { x: 15, y: 15 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let gameRunning = true;
        let gameSpeed = 100;

        // Generate random food position
        function generateFood() {
            let newFood;
            let collision = true;
            while (collision) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                collision = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }
            return newFood;
        }

        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case 'arrowup':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    e.preventDefault();
                    break;
                case 'arrowdown':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    e.preventDefault();
                    break;
                case 'arrowleft':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    e.preventDefault();
                    break;
                case 'arrowright':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    e.preventDefault();
                    break;
                case ' ':
                    gameRunning = !gameRunning;
                    e.preventDefault();
                    break;
            }
        });

        // Update game state
        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameRunning = false;
                alert('Game Over! Final Score: ' + score);
                resetGame();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameRunning = false;
                alert('Game Over! Final Score: ' + score);
                resetGame();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = 'Score: ' + score;
                food = generateFood();
            } else {
                snake.pop();
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            ctx.fillStyle = '#00ff00';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });

            // Draw food
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
        }

        // Reset game
        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = generateFood();
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            gameRunning = true;
        }

        // Game loop
        let lastUpdate = 0;
        function gameLoop(currentTime) {
            if (currentTime - lastUpdate > gameSpeed) {
                if (gameRunning) {
                    update();
                }
                lastUpdate = currentTime;
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        requestAnimationFrame(gameLoop);
    </script>
</body>

</html>
